name: Waitlist Slot Rescue verification

on:
  workflow_dispatch:
    inputs:
      place_live_call:
        description: Place one separately authorized CALL-E call
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: waitlist-slot-rescue-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository_owner == 'Piotr1231'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_DIR: apps/python/waitlist-slot-rescue
      REQUEST_FILE: /tmp/waitlist-live-request.json
      RESULT_FILE: /tmp/waitlist-live-result.json

    steps:
      - name: Check out the reviewed branch
        uses: actions/checkout@v4
        with:
          ref: feat/waitlist-slot-rescue

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked environment
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.33
          uv sync --frozen

      - name: Run regression tests
        working-directory: ${{ env.APP_DIR }}
        run: uv run pytest -q

      - name: Confirm no-call verification
        if: ${{ !inputs.place_live_call }}
        run: echo "Regression verification completed without placing a phone call."

      - name: Build one-recipient authorized demo request
        if: ${{ inputs.place_live_call }}
        shell: bash
        env:
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
          TEST_LOCALE: ${{ vars.TEST_LOCALE || 'de-DE' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          phone = os.environ.get("TEST_PHONE", "")
          if not re.fullmatch(r"\+[1-9]\d{7,14}", phone):
              raise SystemExit("TEST_PHONE must be a valid E.164 number stored as a repository secret")

          locale = os.environ.get("TEST_LOCALE", "")
          if not re.fullmatch(r"[a-z]{2,3}(?:-[A-Z]{2})?", locale):
              raise SystemExit("TEST_LOCALE must be a valid BCP 47 locale such as de-DE")

          now = datetime.now(timezone.utc)
          request = {
              "workflow_id": "waitlist-live-demo-v1",
              "slot_id": "waitlist-live-demo-slot-v1",
              "business_display_name": "Waitlist Slot Rescue Demo",
              "service_category": "other-non-regulated",
              "service_label": "demo consultation",
              "slot_start": (now + timedelta(hours=2)).isoformat(),
              "offer_expires_at": (now + timedelta(hours=1)).isoformat(),
              "candidates": [{
                  "candidate_id": "authorized-demo-owner",
                  "phone": phone,
                  "position": 1,
                  "locale": locale,
                  "consented_to_waitlist_calls": True,
              }],
          }
          Path(os.environ["REQUEST_FILE"]).write_text(json.dumps(request), encoding="utf-8")
          PY

      - name: Place exactly one authorized CALL-E demo call
        if: ${{ inputs.place_live_call }}
        working-directory: ${{ env.APP_DIR }}
        env:
          CALLE_API_KEY: ${{ secrets.CALLE_API_KEY }}
        run: |
          uv run python rescue.py \
            --request "$REQUEST_FILE" \
            --execute \
            --confirm-authorized-waitlist \
            --timeout-seconds 300 \
            --output "$RESULT_FILE" >/dev/null

      - name: Print privacy-minimized verification result
        if: ${{ always() && inputs.place_live_call }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RESULT_FILE"])
          if not path.exists():
              print(json.dumps({"result_available": False}))
          else:
              result = json.loads(path.read_text(encoding="utf-8"))
              safe = {
                  "result_available": True,
                  "mode": result.get("mode"),
                  "creates_phone_calls": result.get("creates_phone_calls"),
                  "status": result.get("status"),
                  "booking_created": result.get("booking_created"),
                  "human_confirmation_required": result.get("human_confirmation_required"),
                  "human_review_required": result.get("human_review_required"),
                  "attempt_count": len(result.get("attempts", [])),
                  "attempts": [
                      {
                          "candidate_id": item.get("candidate_id"),
                          "phone": item.get("phone"),
                          "outcome": item.get("outcome"),
                          "classification_reason": item.get("classification_reason"),
                          "provider_diagnostics": item.get("provider_diagnostics"),
                      }
                      for item in result.get("attempts", [])
                  ],
                  "untouched_candidate_ids": result.get("untouched_candidate_ids"),
              }
              print(json.dumps(safe, indent=2))
          PY

      - name: Remove temporary call files
        if: ${{ always() && inputs.place_live_call }}
        run: rm -f "$REQUEST_FILE" "$RESULT_FILE"
